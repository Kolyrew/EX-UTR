# =============================================================================
#  EX-UTR: default configuration
#  All paths are relative to the project root.
# =============================================================================

seed: 42

data:
  csv_path: "data/expression_utr_summary.csv"
  target_column: "expression_level"      # numeric, raw expression
  utr5_column: "UTR5_Sequence"
  utr3_column: "UTR3_Sequence"
  gene_column: "gene_symbol"
  tissue_column: "tissue"
  log1p_target: true                     # predict log(y + 1) instead of y

split:
  strategy: "gene"                       # "gene" or "random"
  val_fraction: 0.10
  test_fraction: 0.10                    # kept aside; not used if 0.0

model:
  pretrained_name: "multimolecule/utrbert-5mer"
  nmers: 5
  max_seq_len: 400
  tissue_embed_dim: 16
  dropout: 0.1
  freeze_encoder_epochs: 1               # freeze BERT for first N epochs
  n_tissues: 10

training:
  epochs: 10
  batch_size: 8
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_fraction: 0.05
  num_workers: 2
  device: "auto"                         # "auto" | "cuda" | "cpu"
  early_stopping_patience: 3
  gradient_clip_norm: 1.0

logging:
  results_dir: "results"
  save_best_checkpoint: true
  save_plots: true
